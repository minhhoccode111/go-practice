{{define "content"}}
<div id="sessions">
  <div class="sessions-bar">
    <h2>Sessions</h2>
    <span id="sessions-spinner" class="htmx-indicator">…</span>
    <button
      class="sessions-delete-all"
      hx-delete="/htmx/sessions"
      hx-swap="none"
      hx-confirm="Delete all sessions? You'll be logged out."
      hx-indicator="#sessions-spinner, this"
      hx-disable="this"
    >
      Delete all sessions
    </button>
  </div>
  <p hx-get="/htmx/sessions/me" hx-trigger="load" hx-swap="outerHTML">
    Loading…
  </p>
</div>

<style>
  #sessions {
    max-width: 35vw;
    margin: 2rem auto;
    font-family:
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
  }

  .sessions-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .sessions-bar h2 {
    margin-right: auto;
  }

  .sessions-delete-all {
    padding: 0.25rem 0.625rem;
    font: inherit;
    font-size: 0.875rem;
    color: #606a76;
    background: none;
    border: 1px solid #d5d9de;
    border-radius: 6px;
    cursor: pointer;
    transition:
      color 120ms ease,
      border-color 120ms ease;
  }

  .sessions-delete-all:hover {
    color: #b3261e;
    border-color: #b3261e;
  }

  .sessions-delete-all.htmx-request {
    opacity: 0.5;
  }

  .sessions-delete-all:focus-visible {
    outline: 2px solid #16181d;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .sessions-delete-all {
      transition: none;
    }
  }
</style>

{{end}}
