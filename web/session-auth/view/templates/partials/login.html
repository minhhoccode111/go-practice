{{define "content"}}

<div id="login">
  <h2>Login</h2>

  {{if .Registered}}
  <p class="success">Account created. Please log in.</p>
  {{end}}

  <form
    hx-post="/htmx/login"
    hx-target="#login"
    hx-swap="innerHTML"
    hx-status:422="target:#login-errors swap:innerHTML"
    hx-indicator="#login-spinner"
    hx-disable="#login input, #login button"
  >
    <div>
      <label>
        Email:
        <input type="email" name="email" required />
      </label>
    </div>

    <div>
      <label>
        Password:
        <input type="password" name="password" required />
      </label>
    </div>

    <div id="login-errors"></div>

    <div class="login-actions">
      <span id="login-spinner" class="htmx-indicator">…</span>
      <button type="submit">Login</button>
    </div>
  </form>

  <p>Don't have account? <a href="/register">Register</a> now</p>
</div>

<style>
  #login {
    max-width: 35vw;
    margin: auto;
  }

  #login label {
    display: block;
    margin-bottom: 0.75rem;
  }

  #login input {
    display: block;
    box-sizing: border-box;
    width: 100%;
    margin-top: 0.25rem;
  }

  .login-actions {
    text-align: right;
  }

  .success {
    color: green;
  }

  form.htmx-request input,
  form.htmx-request button {
    opacity: 0.6;
  }
</style>

{{end}}
