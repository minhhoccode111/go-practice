x-db-env: &x-db-env
  POSTGRES_DB: "entdemo"
  POSTGRES_PASSWORD: "password"
  POSTGRES_USER: "user"
  PGDATA: "/var/lib/postgresql/data"

services:
  db:
    container_name: db-entdemo
    image: postgres
    environment:
      <<: *x-db-env
    volumes:
      - entdemo_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    mem_limit: 256Mb
    cpus: 0.25

volumes:
  entdemo_data:
